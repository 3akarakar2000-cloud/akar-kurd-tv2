 <!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Made By Akar</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-dark: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-light: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 15px; overflow-x: hidden; user-select: none; }
        
        header { text-align: center; margin-bottom: 25px; padding: 15px 0; border-bottom: 1px solid var(--border-color); background: radial-gradient(circle at top, rgba(79, 172, 254, 0.1), transparent); border-radius: 20px; }
        header h1 { background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; font-size: 28px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 10px 30px rgba(0, 242, 254, 0.3); }

        #main-content { max-width: 1200px; margin: 0 auto; }
        .main-layout { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        
        .player-container { width: 100%; background: #000; border-radius: 20px; overflow: hidden; display: none; border: 1px solid var(--border-color); box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: 0.3s; }
        video { width: 100%; aspect-ratio: 16/9; display: block; outline: none; }
        
        @media (min-width: 900px) {
            .main-layout.playing { flex-direction: row; align-items: flex-start; }
            .main-layout.playing .player-container { flex: 2; position: sticky; top: 20px; }
            .main-layout.playing .content-area { flex: 1; }
        }

        .tabs-container { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0 15px 0; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-item { background: var(--card-bg); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 14px; border: 1px solid var(--border-color); white-space: nowrap; transition: 0.3s; backdrop-filter: blur(10px); }
        .tab-item.active { background: linear-gradient(135deg, var(--secondary), var(--primary)); color: #000; border-color: transparent; box-shadow: 0 5px 15px rgba(0, 242, 254, 0.3); }

        .grid-channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        .channel-item { background: var(--card-bg); border-radius: 16px; padding: 15px 10px; text-align: center; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); gap: 10px; }
        .channel-item:hover { transform: translateY(-5px); border-color: var(--secondary); background: rgba(30, 41, 65, 0.8); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
        
        .channel-img { width: 55px; height: 55px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); transition: 0.3s; border-radius: 10px; }
        .channel-item:hover .channel-img { transform: scale(1.1); }
        .channel-title { font-weight: 700; font-size: 13px; color: #e2e8f0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ستاڵی WebViewـی نوێ بۆ ئایفۆن و مۆبایلەکان */
        #webview-container {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-dark); z-index: 99999; flex-direction: column;
        }
        .webview-header {
            background: #0b0f19; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary);
            padding-top: env(safe-area-inset-top, 40px); /* بۆ نۆچی شاشەکە */
        }
        .webview-header h3 { color: var(--text-light); margin: 0; font-size: 16px; font-weight: bold; }
        .close-btn {
            background: #ef4444; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .close-btn:hover { background: #dc2626; }
        #webview-frame { flex: 1; width: 100%; border: none; background: #000; }

    </style>
</head>

    <script>
        let hls = null;

        function filterCategory(category, element) {
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');

            const items = document.querySelectorAll('.channel-item');
            items.forEach(item => {
                if (category === 'all' || item.getAttribute('data-cat') === category) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // فەنکشنە نوێیەکە بۆ کردنەوەی کەنالەکان لەناو ماڵپەڕەکەی خۆت بەبێ ڕۆیشتنە دەرەوە
        function openWebView(url) {
            // ڤیدیۆی سەرەکی دەوەستێنین ئەگەر ئیشی دەکرد
            const mainVideo = document.getElementById('my-video');
            if (mainVideo) { mainVideo.pause(); }

            // کردنەوەی پەنجەرەی WebView
            document.getElementById('webview-frame').src = url;
            document.getElementById('webview-container').style.display = 'flex';
        }

        // داخستنی WebView و گەڕانەوە بۆ ماڵپەڕەکەت
        function closeWebView() {
            document.getElementById('webview-frame').src = '';
            document.getElementById('webview-container').style.display = 'none';
        }

        function startStream(streamUrl) {
            document.getElementById("p-box").style.display = "block";
            document.getElementById("layout-wrapper").classList.add("playing");
            const video = document.getElementById('my-video');

            if (Hls.isSupported()) {
                if (hls) { hls.destroy(); }
                hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => console.log("بەکارهێنەر دەبێت کلیک بکات بۆ کارپێکردن"));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
            
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
