<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Ball Pool</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            /* باکگراوندێکی تاریک و گونجاو لەگەڵ یاری بلیارد */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-badge {
            background-color: #28a745;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 25px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.4);
            animation: pulse 2s infinite;
        }
        .logo {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
            border: 3px solid #d4af37; /* ڕەنگی ئاڵتوونی بۆ چوارچێوەی لۆگۆکە */
        }
        .install-btn {
            background: linear-gradient(to right, #00b4db, #0083b0);
            color: white;
            text-decoration: none;
            padding: 16px 45px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 35px;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }
        .install-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 180, 219, 0.5);
            background: linear-gradient(to right, #00c6ff, #0072ff);
        }

        /* ئەنیمەیشن بۆ نوسینی سەرەوە */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">Servers now Working</div>
        <br>
        <img src="image.png" alt="Aka 8 Ball Pool" class="logo">
        <br>
        <a href="#" class="install-btn">Free Install</a>
    </div>

</body>
</html>
