<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppLife Store - ئینستاڵکردنی ڕاستەوخۆ</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
            --primary-color: #34c759; /* ڕەنگی سەوز بۆ ئینستاڵی ئامادە */
            --text-secondary: #86868b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            max-width: 600px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        header h1 { font-size: 28px; margin-bottom: 5px; }
        header p { color: var(--text-secondary); font-size: 14px; }

        .apps-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .app-info { display: flex; align-items: center; gap: 12px; }
        .app-icon { width: 50px; height: 50px; border-radius: 10px; background-color: #eee; }
        .app-details h3 { font-size: 15px; font-weight: 600; }
        .app-details p { font-size: 12px; color: var(--text-secondary); }

        .install-btn {
            background-color: #eafaf1;
            color: var(--primary-color);
            padding: 6px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .install-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>AppLife Direct Store</h1>
        <p>داگرتنی ڕاستەوخۆ بەبێ پێویستی بە کۆمپیوتەر یان سێرڤەر</p>
    </header>

    <div class="apps-container">

        <div class="app-card">
            <div class="app-info">
                <img src="https://usescarlet.com/icon.png" class="app-icon" onerror="this.src='https://via.placeholder.com/50'">
                <div class="app-details">
                    <h3>Scarlet Installer</h3>
                    <p>باشترین بەرنامە بۆ ساینکردنی فایلی IPA لای خۆت</p>
                </div>
            </div>
            <a href="itms-services://?action=download-manifest&url=https://usescarlet.com/manifest.plist" class="install-btn">INSTALL</a>
        </div>

        <div class="app-card">
            <div class="app-info">
                <img src="https://via.placeholder.com/50" class="app-icon">
                <div class="app-details">
                    <h3>TikTok LRD (Signed)</h3>
                    <p>وێژەی هاککراو - سێرڤەری گشتی</p>
                </div>
            </div>
            <a href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/arshia-x/test/main/tiktok.plist" class="install-btn">INSTALL</a>
        </div>

        <div class="app-card">
            <div class="app-info">
                <img src="https://via.placeholder.com/50" class="app-icon">
                <div class="app-details">
                    <h3>E-Sign (No Computer)</h3>
                    <p>ئامرازی ئیمزاکردنی ئەپەکان بۆ ئایفۆن</p>
                </div>
            </div>
            <a href="itms-services://?action=download-manifest&url=https://esign.yyyue.xyz/manifest.plist" class="install-btn">INSTALL</a>
        </div>

    </div>

</body>
</html>
