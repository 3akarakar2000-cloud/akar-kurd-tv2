<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akar TV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #0b0f19; --card: #161b2d; --primary: #00f2fe; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
        .item { background: var(--card); padding: 10px; border-radius: 15px; text-align: center; cursor: pointer; border: 1px solid #333; }
        .item img { width: 60px; height: 60px; object-fit: contain; border-radius: 10px; display: block; margin: 0 auto 10px; }
        
        #wv-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9999; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: red; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 10000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="wv-overlay">
    <div class="close-btn" onclick="hideWV()">داخستن ✖</div>
    <iframe id="wv-frame"></iframe>
</div>

<div class="grid" id="list"></div>

<script>
    // لۆگۆی کەنالەکان - ئەگەر لۆگۆت نەبوو، ئەم لینکەی خوارەوە بەکاردێ
    const logos = {
        "beIN 1": "https://upload.wikimedia.org/wikipedia/commons/4/43/BeIN_Sports_logo.svg",
        "Kurdistan 24": "https://upload.wikimedia.org/wikipedia/commons/4/4e/Kurdistan24_logo.png",
        "Rudaw": "https://upload.wikimedia.org/wikipedia/commons/e/ea/Rudaw_Media_Network_Logo.png",
        "Waar TV": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Waar_TV_Logo.png/240px-Waar_TV_Logo.png"
    };

    const channels = [
        {name: "beIN 1", url: "https://stream.supertv.gg:3001/supertv/sport/stv1/ch1/adaptive.m3u8"},
        {name: "beIN 2", url: "http://sewv654wfcsdwfi87fwvgbngh.siauliairsavlt.pw/iptv/PQRQCB2NKUWPMCFCEQXDT4Z3/6123/index.m3u8"},
        {name: "Kurdistan 24", url: "https://d1x82nydcxndze.cloudfront.net/live/index_720p25.m3u8"},
        {name: "4 Kurd", url: "http://4kuhls.persiana.live/hls/stream.m3u8"},
        {name: "Mix Kurdish", url: "http://avrstream.com:1935/live/Mix-kurdy/playlist.m3u8"},
        {name: "Bnar Action", url: "http://krdtvappfree.ddns.net/bnarmoviesKRDTV/index.m3u8"},
        {name: "Bnar Movies", url: "http://krdtvappfree.ddns.net/servertvnnew2025KRDTV/index.m3u8"},
        {name: "Bnar Family", url: "http://krdtvappfree.ddns.net/bnar4kKRDTV/index.m3u8"},
        {name: "Bnar Quran", url: "http://baskhd.ddns.net:40/live/QURANHDTV/mono.m3u8"}
    ];

    const list = document.getElementById('list');
    channels.forEach(ch => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<img src="${logos[ch.name] || 'https://ui-avatars.com/api/?name='+ch.name}" onerror="this.src='https://ui-avatars.com/api/?name=TV'"><div>${ch.name}</div>`;
        div.onclick = () => showWV(ch.url);
        list.appendChild(div);
    });

    function showWV(url) {
        document.getElementById('wv-frame').src = url;
        document.getElementById('wv-overlay').style.display = 'block';
    }

    function hideWV() {
        document.getElementById('wv-overlay').style.display = 'none';
        document.getElementById('wv-frame').src = '';
    }
</script>
</body>
</html>
