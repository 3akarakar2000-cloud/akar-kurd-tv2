<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Made By Akar | Premium TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --bg-dark: #07090f; --card-bg: rgba(20, 25, 40, 0.6); --card-border: rgba(255, 255, 255, 0.05); --text-main: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at top right, #131b2f, #07090f 100%); color: var(--text-main); min-height: 100vh; padding: 20px 15px; user-select: none; }
        header { text-align: center; margin-bottom: 25px; padding: 20px 0; background: rgba(79, 172, 254, 0.1); border-radius: 24px; border: 1px solid var(--card-border); position: relative; }
        header h1 { color: var(--primary); font-size: 24px; font-weight: 900; }
        .about-btn { position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .grid-channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; }
        .channel-item { background: var(--card-bg); border-radius: 18px; padding: 15px 10px; text-align: center; cursor: pointer; border: 1px solid var(--card-border); transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 10px; backdrop-filter: blur(10px); }
        .channel-item:hover { transform: translateY(-5px); border-color: var(--primary); }
        .channel-img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; background: #fff; }
        .channel-title { font-weight: 700; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        #toast { visibility: hidden; background: var(--primary); color: #000; padding: 12px 20px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); border-radius: 30px; z-index: 999999; font-weight: bold; transition: 0.5s; }
        #toast.show { visibility: visible; }
        #player-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; }
        .player-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #000; }
        video { width: 100%; height: 80vh; }
        #about-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 100000; justify-content: center; align-items: center; }
        .modal-content { background: #131b2f; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid var(--primary); }
    </style>
</head>
<body>

    <div id="toast">پڕۆسەکە جێبەجێ دەبیت...</div>

    <div id="about-modal">
        <div class="modal-content">
            <h2>دەربارە</h2>
            <p>دروستکراوە لە لایەن <strong>ئاکار دیاری</strong></p>
            <button onclick="document.getElementById('about-modal').style.display='none'" style="margin-top:20px; padding:10px 20px; cursor:pointer;">داخستن</button>
        </div>
    </div>

    <div id="player-container">
        <div class="player-header">
            <h3 style="color:var(--primary)">پەخشی ڕاستەوخۆ</h3>
            <button onclick="closePlayer()" style="background:red; color:white; border:none; padding:8px 15px; border-radius:10px;">داخستن ✖</button>
        </div>
        <video id="video-element" controls autoplay playsinline></video>
    </div>

    <header>
        <button class="about-btn" onclick="document.getElementById('about-modal').style.display='flex'">ℹ️</button>
        <h1>Made By Akar</h1>
    </header>

    <div class="grid-channels" id="channels-list">
        <script>
            const channels = [
                {name: "NRT HD", url: "https://hlspackager.akamaized.net/live/DB/NRT_HD/HLS/NRT_HD-avc1_2500000=10002,mp4a_128000=20000.m3u8"},
                {name: "Rudaw", url: "https://live.rudaw.net/hls/rudaw-tv/master.m3u8"},
                {name: "AVA", url: "https://ava2.store/upload/ava.m3u8"},
                {name: "Channel 8", url: "https://live.channel8.com/Channel8-Kurdish/tracks-v4a1/mono.m3u8"},
                {name: "Hormzyar HD", url: "http://avrstream.com:1935/live/HormzyarHD/playlist.m3u8"},
                {name: "War", url: "https://live.kwikmotion.com/waarmedialive/waarmedia.smil/waarmediapublish/waarmedia_source/chunks.m3u8"},
                {name: "Avar", url: "https://avr.host247.net/live/AvarTv/playlist.m3u8"},
                {name: "Kurdsat News", url: "https://hlspackager.akamaized.net/live/DB/KURDSAT_NEWS/HLS/KURDSAT_NEWS.m3u8"},
                {name: "Kurdsat", url: "https://hlspackager.akamaized.net/live/DB/KURDSAT_HD/HLS/KURDSAT_HD-avc1_2500000=10002,mp4a_128000=20000.m3u8"},
                {name: "K24", url: "https://d1x82nydcxndze.cloudfront.net/live/index.m3u8"},
                {name: "Gali KRD", url: "https://live.host247.net/gk/gksat/chunklist_w950982176.m3u8"},
                {name: "Kurdistan TV", url: "https://5a3ed7a72ed4b.streamlock.net/live/SMIL:myStream.smil/chunklist_w735693271_b1700000_sleng_t64MTA4MHA=.m3u8"},
                {name: "NRT 2", url: "https://ca-rt.onetv.app/NRT2/index-0.m3u8?token=onetv202"},
                {name: "NRT 4", url: "https://live20.bozztv.com/giatv/giatv-nrt4stream/nrt4stream/chunks.m3u8"},
                {name: "4 Kurd", url: "http://4kuhls.persiana.live/hls/stream.m3u8"},
                {name: "Ala TV", url: "http://avrstream.com:1935/live/ala-hd/playlist.m3u8"},
                {name: "Bnar Action", url: "http://krdtvappfree.ddns.net/bnarmoviesKRDTV/index.m3u8"},
                {name: "Bnar Quran", url: "http://baskhd.ddns.net:40/live/QURANHDTV/mono.m3u8"},
                {name: "Bnar Movies", url: "http://krdtvappfree.ddns.net/servertvnnew2025KRDTV/index.m3u8"},
                {name: "Bnar Family", url: "http://krdtvappfree.ddns.net/bnar4kKRDTV/index.m3u8"},
                {name: "Mix Kurdish", url: "http://avrstream.com:1935/live/Mix-kurdy/playlist.m3u8"},
                {name: "UFC", url: "https://linear-893.frequency.stream/dist/xumo/893/hls/master/playlist.m3u8"},
                {name: "Barca", url: "https://amg17560-fcb-amg17560c1-rakuten-uk-4891.playouts.now.amagi.tv/playlist/amg17560-fcbarcelona-topbarcaenglish-rakutenuk/playlist.m3u8"},
                {name: "Real Madrid", url: "https://rmtv.akamaized.net/hls/live/2043153/rmtv-es-web/master.m3u8"},
                {name: "Bensport 1", url: "https://stream.supertv.gg:3001/supertv/sport/stv1/ch1/adaptive.m3u8"},
                {name: "Bensport 2", url: "http://sewv654wfcsdwfi87fwvgbngh.siauliairsavlt.pw/iptv/PQRQCB2NKUWPMCFCEQXDT4Z3/6123/index.m3u8"},
                {name: "Bensport", url: "https://stream.supertv.gg:3001/supertv/sport/stv1/ch1/ch1_720.m3u8"},
                {name: "Parwarda H", url: "https://parwarda.unitedmixmedia.tv/Parwardayi_Hawler/tracks-v2a1/mono.m3u8"},
                {name: "Parwarda S", url: "https://parwarda.unitedmixmedia.tv/Parwarda/tracks-v2a1/mono.m3u8"},
                {name: "Perwarda D", url: "https://parwarda.unitedmixmedia.tv/Parwardayi_Duhok/tracks-v2a1/mono.m3u8"}
            ];

            channels.forEach(ch => {
                document.write(`
                    <div class="channel-item" onclick="playChannel('${ch.url}')">
                        <img src="https://ui-avatars.com/api/?name=${ch.name}&background=random" class="channel-img">
                        <span class="channel-title">${ch.name}</span>
                    </div>
                `);
            });

            function playChannel(url) {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 5000);

                const video = document.getElementById('video-element');
                document.getElementById('player-container').style.display = 'block';

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    video.play();
                } else { video.src = url; video.play(); }
            }

            function closePlayer() {
                document.getElementById('player-container').style.display = 'none';
                document.getElementById('video-element').pause();
            }
        </script>
    </div>
</body>
</html>
